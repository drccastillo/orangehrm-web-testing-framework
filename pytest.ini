[pytest]
# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths - features, framework unit tests, shared unit tests, and integration
testpaths =
    orangehrm
    framework
    shared
    integration

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --html=reports/report.html
    --self-contained-html
    -p no:warnings

# Markers
markers =
    authentication: Authentication feature tests
    employees: Employee management tests
    leave: Leave management tests
    time: Time tracking tests
    admin: Admin feature tests
    smoke: Quick smoke tests (deselect with '-m "not smoke"')
    regression: Full regression suite
    slow: Slow running tests
    integration: Integration tests
    unit: Unit tests for framework components
    demo: Demo tests for visual debugging (highlight/blink effects)

# Logging
log_cli = false
log_cli_level = INFO
log_file = logs/pytest.log
log_file_level = DEBUG

# Coverage (if using pytest-cov)
[coverage:run]
source = orangehrm, framework, shared
omit =
    */tests/*
    */unittests/*
    */__pycache__/*
    */conftest.py
