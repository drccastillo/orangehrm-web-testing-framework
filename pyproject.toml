[project]
name = "orange-hrm-test-framework"
version = "0.1.0"
description = "Web testing automation framework for OrangeHRM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.4.2",
    "selenium>=4.35.0",
    "python-dotenv>=1.0.0",
    "pytest-xdist>=3.6.0",
    "pytest-html>=4.1.1",
    "playwright>=1.49.0",
    "pytest-playwright>=0.6.2",
    "allure-pytest>=2.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "tests", "utils"]

[tool.pytest.ini_options]
testpaths = ["tests_selenium", "tests_playwright"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = """
    -v
    --tb=short
    --strict-markers
"""
markers = [
    "smoke: Quick smoke tests",
    "regression: Full regression tests",
    "login: Login related tests",
    "playwright: Tests using Playwright",
    "selenium: Tests using Selenium",
]

[dependency-groups]
dev = [
    "black>=24.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.5.0",
    "isort>=5.13.0",
    "autoflake>=2.3.0",
    "bandit>=1.7.0",
    "pydocstyle>=6.3.0",
]

# Black configuration
[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | __pycache__
  | reports_playwright
  | reports_selenium
  | logs
)/
'''

# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    "reports_playwright",
    "reports_selenium",
    "logs",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "B904",  # Allow raising exceptions without from e
    "N812",  # Allow EC as alias for expected_conditions (standard convention)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests_*/**" = ["S101"]
"unittests/**" = ["S101"]
"src/pages_selenium/login_page.py" = ["N802"]  # Properties expose constants as uppercase

# isort configuration
[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["src", "utils"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
multi_line_output = 3
include_trailing_comma = true

# mypy configuration
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "tests_selenium/",
    "tests_playwright/",
    "unittests/",
]

# Bandit configuration
[tool.bandit]
exclude_dirs = ["tests_selenium", "tests_playwright", "unittests", ".venv"]
skips = ["B101"]  # Skip assert warnings in general code

# pydocstyle configuration
[tool.pydocstyle]
convention = "google"
add_ignore = ["D100", "D104", "D105", "D107", "D212", "D205"]
match = "(?!test_).*\\.py"
match_dir = "^(?!(tests_|unittests|reports_|logs|\\.)).*"
