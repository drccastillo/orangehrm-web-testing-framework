name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      browsers:
        description: 'Browsers to test'
        required: false
        default: 'firefox'
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - chromium,firefox
          - chromium,webkit
          - firefox,webkit
          - all
      headless:
        description: 'Run in headless mode'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  PYTHON_VERSION: "3.13"

jobs:
  # ============================================================================
  # Job 1: Code Quality Checks (Fast, runs in parallel)
  # ============================================================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache UV dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run Ruff format check
        run: uv run ruff format --check .

      - name: Run Ruff linter
        run: uv run ruff check .

      - name: Run Bandit security scan
        run: uv run bandit -r src/ utils/ -c pyproject.toml

  # ============================================================================
  # Job 2: Unit Tests (Fast, no browser needed)
  # ============================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache UV dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync

      - name: Create .env file
        run: |
          cat << EOF > .env
          URL=${{ vars.ORANGEHRM_URL }}
          ORANGEHRM_USERNAME=${{ secrets.ORANGEHRM_USERNAME }}
          ORANGEHRM_PASSWORD=${{ secrets.ORANGEHRM_PASSWORD }}
          PW_BROWSER=chromium
          HEADLESS=True
          DEFAULT_TIMEOUT=10
          PAGE_LOAD_TIMEOUT=30
          WINDOW_WIDTH=1920
          WINDOW_HEIGHT=1080
          MAXIMIZE_WINDOW=True
          SCREENSHOT_ON_FAILURE=True
          EOF

      - name: Run unit tests
        run: uv run pytest unittests/ -v --tb=short

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-logs
          path: logs/
          retention-days: 30

  # ============================================================================
  # Job 3: Smoke Tests (Critical paths, runs on all branches)
  # ============================================================================
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.55.0-jammy
      options: --ipc=host --init

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache UV dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-docker-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            uv-docker-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync

      - name: Create .env file
        run: |
          cat << EOF > .env
          URL=${{ vars.ORANGEHRM_URL }}
          ORANGEHRM_USERNAME=${{ secrets.ORANGEHRM_USERNAME }}
          ORANGEHRM_PASSWORD=${{ secrets.ORANGEHRM_PASSWORD }}
          PW_BROWSER=chromium
          HEADLESS=True
          DEFAULT_TIMEOUT=10
          PAGE_LOAD_TIMEOUT=30
          WINDOW_WIDTH=1920
          WINDOW_HEIGHT=1080
          MAXIMIZE_WINDOW=True
          SCREENSHOT_ON_FAILURE=True
          EOF

      - name: Run smoke tests
        run: |
          # Build browser flags based on input
          BROWSER_FLAGS=""
          if [ "${{ github.event.inputs.browsers }}" == "all" ]; then
            BROWSER_FLAGS="--browser chromium --browser firefox --browser webkit"
          elif [ -n "${{ github.event.inputs.browsers }}" ]; then
            # Convert "chromium,firefox" to "--browser chromium --browser firefox"
            BROWSERS="${{ github.event.inputs.browsers }}"
            for browser in ${BROWSERS//,/ }; do
              BROWSER_FLAGS="$BROWSER_FLAGS --browser $browser"
            done
          else
            BROWSER_FLAGS="--browser chromium"
          fi

          # Add --headed flag if needed
          HEADED_FLAG=""
          if [ "${{ github.event.inputs.headless }}" == "false" ]; then
            HEADED_FLAG="--headed"
          fi

          # Run tests
          uv run pytest tests/ -m smoke -v --tb=short -n auto \
            $BROWSER_FLAGS $HEADED_FLAG \
            --alluredir=reports/allure-results \
            --html=reports/pytest-report.html \
            --self-contained-html
        timeout-minutes: 10

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report-smoke
          path: reports/pytest-report.html
          retention-days: 30

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-smoke
          path: reports/allure-results/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-smoke
          path: |
            test-results/
            logs/
            reports/screenshots/
          retention-days: 30

  # ============================================================================
  # Job 4: Regression Tests (Full suite, main branch only)
  # ============================================================================
  regression-tests:
    name: Regression Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    container:
      image: mcr.microsoft.com/playwright/python:v1.55.0-jammy
      options: --ipc=host --init

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache UV dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-docker-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            uv-docker-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync

      - name: Create .env file
        run: |
          cat << EOF > .env
          URL=${{ vars.ORANGEHRM_URL }}
          ORANGEHRM_USERNAME=${{ secrets.ORANGEHRM_USERNAME }}
          ORANGEHRM_PASSWORD=${{ secrets.ORANGEHRM_PASSWORD }}
          PW_BROWSER=${{ matrix.browser }}
          HEADLESS=True
          DEFAULT_TIMEOUT=10
          PAGE_LOAD_TIMEOUT=30
          WINDOW_WIDTH=1920
          WINDOW_HEIGHT=1080
          MAXIMIZE_WINDOW=True
          SCREENSHOT_ON_FAILURE=True
          EOF

      - name: Run regression tests
        run: |
          # Add --headed flag if needed
          HEADED_FLAG=""
          if [ "${{ github.event.inputs.headless }}" == "false" ]; then
            HEADED_FLAG="--headed"
          fi

          # Run tests with browser from matrix
          uv run pytest tests/ -m regression -v --tb=short -n auto \
            --browser ${{ matrix.browser }} $HEADED_FLAG \
            --alluredir=reports/allure-results \
            --html=reports/pytest-report.html \
            --self-contained-html
        timeout-minutes: 30

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report-regression-${{ matrix.browser }}
          path: reports/pytest-report.html
          retention-days: 30

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-regression-${{ matrix.browser }}
          path: reports/allure-results/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-regression-${{ matrix.browser }}
          path: |
            test-results/
            logs/
            reports/screenshots/
          retention-days: 30

  allure-report:
    name: Generate Allure Report
    runs-on: ubuntu-latest
    needs: [smoke-tests, regression-tests]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results-temp
          merge-multiple: false

      - name: Merge Allure results
        run: |
          mkdir -p allure-results
          find allure-results-temp -name "*.json" -o -name "*.txt" -o -name "*.xml" | while read file; do
            cp "$file" allure-results/
          done
          ls -la allure-results/

      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Copy Allure history
        if: always()
        continue-on-error: true
        run: |
          if [ -d "gh-pages/allure-history" ]; then
            cp -r gh-pages/allure-history allure-history
          fi

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Setup Git for GitHub Pages
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy Allure report to GitHub Pages
        if: always()
        run: |
          cd allure-history
          git init
          git add -A
          git commit -m "Deploy Allure report"
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:gh-pages

      - name: Upload Allure Report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-history/
          retention-days: 30
