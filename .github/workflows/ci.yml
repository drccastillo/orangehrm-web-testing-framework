name: CI/CD Pipeline (Improved)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run nightly regression tests at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test-suite:
        description: 'Test suite to run'
        required: true
        type: choice
        options:
          - all
          - smoke
          - regression
          - login
        default: 'smoke'
      browsers:
        description: 'Browsers (comma separated: chrome,firefox,edge)'
        required: false
        type: string
        default: 'chrome'

# Concurrency: Cancel in-progress runs for same workflow on same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:
  # ============================================
  # Stage 1: Code Quality & Static Analysis
  # ============================================
  code-quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better analysis

      - name: Install UV
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache UV dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync

      - name: Run Black formatter check
        run: |
          uv run black --check --diff orangehrm/ framework/ shared/
          echo "✅ Black formatting check passed" >> $GITHUB_STEP_SUMMARY

      - name: Run Ruff linter
        run: |
          uv run ruff check orangehrm/ framework/ shared/ --output-format=github
          echo "✅ Ruff linting passed" >> $GITHUB_STEP_SUMMARY

      - name: Run MyPy type checker
        continue-on-error: true
        run: |
          uv run mypy orangehrm/ framework/ shared/ --ignore-missing-imports --install-types --non-interactive
          echo "⚠️ MyPy type checking completed (informational)" >> $GITHUB_STEP_SUMMARY

      - name: Check for security issues (Bandit)
        continue-on-error: true
        run: |
          uv pip install bandit
          uv run bandit -r orangehrm/ framework/ shared/ -f json -o bandit-report.json || true
          if [ -f bandit-report.json ]; then
            echo "### Security Scan Results" >> $GITHUB_STEP_SUMMARY
            echo "Bandit security scan completed. Review artifacts for details." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: bandit-report.json
          if-no-files-found: ignore

  # ============================================
  # Stage 2: Unit Tests
  # ============================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: code-quality
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: Run unit tests with coverage
        run: |
          uv pip install pytest-cov
          uv run pytest -m unit \
            -v \
            --tb=short \
            --cov=framework \
            --cov-report=term-missing \
            --cov-report=html \
            --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unit-tests
          name: unit-tests-coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            htmlcov/
            coverage.xml

  # ============================================
  # Stage 3: Smoke Tests (Fast)
  # ============================================
  smoke-tests:
    name: Smoke Tests
    needs: unit-tests
    if: github.event_name == 'pull_request' || github.event.inputs.test-suite == 'smoke' || github.event.inputs.test-suite == 'all'
    uses: ./.github/workflows/reusable-selenium-tests.yml
    with:
      browser: 'chrome'
      pytest-markers: 'smoke'
      parallel-workers: 2
      headless: true
    secrets: inherit

  # ============================================
  # Stage 4: Cross-Browser Tests (Matrix)
  # ============================================
  cross-browser-tests:
    name: Cross-Browser Tests
    needs: unit-tests
    if: |
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event.inputs.test-suite == 'regression' ||
      github.event.inputs.test-suite == 'all'
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJson(github.event.inputs.browsers || '["chrome", "firefox", "edge"]') }}
        include:
          - browser: chrome
            parallel-workers: 4
          - browser: firefox
            parallel-workers: 3
          - browser: edge
            parallel-workers: 3
    uses: ./.github/workflows/reusable-selenium-tests.yml
    with:
      browser: ${{ matrix.browser }}
      pytest-markers: ${{ github.event.inputs.test-suite == 'regression' && 'regression' || '' }}
      parallel-workers: ${{ matrix.parallel-workers }}
      headless: true
    secrets: inherit

  # ============================================
  # Stage 5: Login Tests (Focused)
  # ============================================
  login-tests:
    name: Login Test Suite
    needs: smoke-tests
    if: github.event.inputs.test-suite == 'login' || github.event.inputs.test-suite == 'all'
    uses: ./.github/workflows/reusable-selenium-tests.yml
    with:
      browser: 'chrome'
      pytest-markers: 'login'
      parallel-workers: 2
      headless: true
    secrets: inherit

  # ============================================
  # Stage 6: Performance & Accessibility
  # ============================================
  performance-tests:
    name: Performance & Accessibility
    needs: smoke-tests
    if: github.event_name == 'schedule' || github.event.inputs.test-suite == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: Run performance tests
        run: |
          echo "### Performance Test Results" >> $GITHUB_STEP_SUMMARY
          echo "Performance testing placeholder - integrate with tools like Locust or k6" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # Stage 7: Test Results Summary
  # ============================================
  test-summary:
    name: Test Summary & Notifications
    needs: [code-quality, unit-tests, smoke-tests, cross-browser-tests]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Generate summary
        run: |
          echo "# 🧪 Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Job Status" >> $GITHUB_STEP_SUMMARY
          echo "- Code Quality: ${{ needs.code-quality.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Unit Tests: ${{ needs.unit-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Smoke Tests: ${{ needs.smoke-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Cross-Browser Tests: ${{ needs.cross-browser-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "Test reports and screenshots have been uploaded as artifacts." >> $GITHUB_STEP_SUMMARY

      - name: Check test results
        if: |
          needs.code-quality.result == 'failure' ||
          needs.unit-tests.result == 'failure' ||
          needs.smoke-tests.result == 'failure' ||
          needs.cross-browser-tests.result == 'failure'
        run: |
          echo "❌ Some tests failed!"
          exit 1
